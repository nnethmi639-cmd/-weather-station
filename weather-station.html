<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Station — Live Conditions, Hourly &amp; 7-Day Outlook</title>
<meta name="description" content="An instrument-panel weather dashboard with current conditions, 12-hour and 7-day forecasts, air quality, sunrise/sunset and favourite cities. No sign-up, no tracking.">
<meta name="theme-color" content="#10161d">
<meta property="og:title" content="Weather Station">
<meta property="og:description" content="A precise, instrument-styled weather dashboard — current conditions, hourly and 7-day outlook, air quality and sunrise/sunset.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Weather Station">
<meta name="twitter:description" content="A precise, instrument-styled weather dashboard.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10161d;
    --panel: #161d26;
    --panel-raised: #1c242f;
    --line: #2b3542;
    --line-soft: #202933;
    --ink: #eef1f3;
    --ink-dim: #8b98a5;
    --ink-faint: #566270;
    --amber: #c98a4b;
    --amber-dim: #8a6339;
    --teal: #5a9aa8;
    --teal-dim: #3c6b76;
    --red: #c9705a;
    --serif: 'Spectral', Georgia, serif;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, #1a2734 0%, transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, #1a2229 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    min-height:100vh;
    padding: 28px 20px 80px;
  }
  .wrap{max-width:960px; margin:0 auto;}

  .skip-link{
    position:absolute; left:-999px; top:auto;
    background:var(--amber); color:#12161c; padding:10px 16px; font-size:12px;
    font-family:var(--mono); z-index:100; font-weight:600;
  }
  .skip-link:focus{left:12px; top:12px;}

  :focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

  .nameplate{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:16px; margin-bottom:22px;
    flex-wrap:wrap; gap:12px;
  }
  .nameplate h1{
    font-family:var(--serif); font-weight:400; font-style:italic;
    font-size:22px; letter-spacing:0.02em; margin:0; color:var(--ink);
  }
  .nameplate-right{display:flex; align-items:center; gap:16px;}
  .nameplate .reg{font-size:11px; color:var(--ink-faint); letter-spacing:0.08em;}
  .unit-toggle{display:flex; border:1px solid var(--line); font-size:11px; letter-spacing:0.06em;}
  .unit-toggle button{background:transparent; border:none; color:var(--ink-faint); padding:6px 10px; font-family:var(--mono); cursor:pointer; font-size:11px;}
  .unit-toggle button.active{background:var(--amber-dim); color:#12161c; font-weight:600;}

  .search-row{display:flex; gap:0; margin-bottom:10px; border:1px solid var(--line); background:var(--panel);}
  .search-row input{flex:1; background:transparent; border:none; outline:none; color:var(--ink); font-family:var(--mono); font-size:13px; padding:13px 14px; letter-spacing:0.02em; min-width:0;}
  .search-row input::placeholder{color:var(--ink-faint);}
  .icon-btn{background:transparent; border:none; border-left:1px solid var(--line); color:var(--ink-dim); padding:0 14px; cursor:pointer; display:flex; align-items:center;}
  .icon-btn:hover{color:var(--amber); background:var(--panel-raised);}
  .icon-btn.starred{color:var(--amber);}
  .icon-btn svg{width:16px; height:16px;}
  .search-row button.locate{background:var(--amber-dim); color:#12161c; border:none; padding:0 20px; font-family:var(--mono); font-size:11px; letter-spacing:0.1em; cursor:pointer; font-weight:600;}
  .search-row button.locate:hover{background:var(--amber);}
  .suggestions{margin-top:-10px; margin-bottom:10px; border:1px solid var(--line); border-top:none; background:var(--panel); display:none; position:relative; z-index:5;}
  .suggestions div{padding:10px 14px; font-size:12.5px; cursor:pointer; border-top:1px solid var(--line-soft); color:var(--ink-dim);}
  .suggestions div:hover{background:var(--panel-raised); color:var(--ink);}

  .favorites{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:26px; min-height:1px;}
  .fav-chip{border:1px solid var(--line); background:var(--panel); color:var(--ink-dim); font-size:10.5px; letter-spacing:0.04em; padding:6px 10px; cursor:pointer; display:flex; align-items:center; gap:6px;}
  .fav-chip:hover{border-color:var(--amber-dim); color:var(--ink);}
  .fav-chip .x{color:var(--ink-faint); font-size:11px;}
  .fav-chip .x:hover{color:var(--red);}

  .alert-banner{
    border:1px solid var(--red); background:rgba(201,112,90,0.08); color:#e5b3a6;
    padding:12px 16px; font-size:12px; letter-spacing:0.02em; margin-bottom:20px;
    display:flex; gap:10px; align-items:flex-start;
  }
  .alert-banner svg{width:16px; height:16px; flex-shrink:0; margin-top:1px; color:var(--red);}
  .alert-banner .lines{display:flex; flex-direction:column; gap:4px;}

  .advisory{border:1px solid var(--line); background:var(--panel); padding:16px 18px; margin-bottom:26px;}
  .advisory .k{font-size:9.5px; color:var(--ink-faint); letter-spacing:0.12em; margin-bottom:10px;}
  .advisory ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px;}
  .advisory li{font-size:12.5px; color:var(--ink-dim); display:flex; gap:10px; align-items:flex-start;}
  .advisory li svg{width:15px; height:15px; margin-top:1px; color:var(--amber); flex-shrink:0;}

  .hero{display:grid; grid-template-columns: 1fr auto; gap:30px; padding:30px 4px 34px; border-bottom:1px solid var(--line); margin-bottom:28px; align-items:center;}
  .hero-top-row{display:flex; justify-content:space-between; align-items:flex-start;}
  .hero-loc{font-size:12px; color:var(--ink-dim); letter-spacing:0.05em; margin-bottom:6px;}
  .hero-loc span{color:var(--ink-faint);}
  .hero-temp{font-family:var(--serif); font-weight:300; font-size:96px; line-height:0.9; color:var(--ink); display:flex; align-items:flex-start;}
  .hero-temp sup{font-size:34px; margin-top:8px; color:var(--ink-dim); font-weight:300;}
  .hero-cond{font-size:14px; color:var(--amber); margin-top:10px; letter-spacing:0.02em; font-style:italic; font-family:var(--serif);}
  .hero-range{font-size:12px; color:var(--ink-faint); margin-top:8px; letter-spacing:0.03em;}
  .hero-time{font-size:11px; color:var(--ink-faint); margin-top:16px; letter-spacing:0.05em;}
  .share-btn{background:transparent; border:1px solid var(--line); color:var(--ink-dim); padding:7px 10px; cursor:pointer; display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10.5px; letter-spacing:0.05em;}
  .share-btn:hover{color:var(--amber); border-color:var(--amber-dim);}
  .share-btn svg{width:13px; height:13px;}

  .dial-wrap{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .dial-label{font-size:9.5px; color:var(--ink-faint); letter-spacing:0.15em;}

  .grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:30px;}
  .cell{background:var(--panel); padding:16px 16px 18px;}
  .cell .k{font-size:9.5px; color:var(--ink-faint); letter-spacing:0.12em; margin-bottom:10px;}
  .cell .v{font-family:var(--serif); font-size:26px; color:var(--ink); font-weight:400;}
  .cell .v .unit{font-size:13px; color:var(--ink-dim); font-family:var(--mono); margin-left:2px;}
  .cell .sub{font-size:10.5px; color:var(--ink-faint); margin-top:6px;}
  .cell .sun-row{display:flex; align-items:center; gap:10px;}

  .section-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .section-head .t{font-size:11px; letter-spacing:0.14em; color:var(--ink-dim);}
  .section-head .rule{flex:1; height:1px; background:var(--line);}

  .hourly{display:flex; overflow-x:auto; gap:0; border:1px solid var(--line); margin-bottom:32px; background:var(--panel);}
  .hourly::-webkit-scrollbar{height:5px;}
  .hourly::-webkit-scrollbar-thumb{background:var(--line);}
  .hour{min-width:72px; text-align:center; padding:16px 8px; border-right:1px solid var(--line-soft); flex-shrink:0;}
  .hour:first-child{background:var(--panel-raised);}
  .hour .t{font-size:10px; color:var(--ink-faint); letter-spacing:0.05em; margin-bottom:10px;}
  .hour svg{width:22px; height:22px; margin-bottom:10px;}
  .hour .temp{font-family:var(--serif); font-size:17px; color:var(--ink);}
  .hour .precip{font-size:9px; color:var(--teal); margin-top:6px;}

  .chart-panel{border:1px solid var(--line); background:var(--panel); padding:18px 18px 8px; margin-bottom:26px;}

  .daily{border:1px solid var(--line); margin-bottom:10px; background:var(--panel);}
  .day{display:grid; grid-template-columns: 90px 26px 1fr 130px; align-items:center; gap:14px; padding:12px 16px; border-top:1px solid var(--line-soft); font-size:12.5px;}
  .day:first-child{border-top:none;}
  .day .d{color:var(--ink-dim); letter-spacing:0.03em;}
  .day svg{width:18px; height:18px;}
  .day .cond{color:var(--ink-faint); font-size:11px;}
  .bar-row{display:flex; align-items:center; gap:8px;}
  .bar-row .lo, .bar-row .hi{font-family:var(--serif); font-size:13px; width:30px;}
  .bar-row .lo{color:var(--ink-faint); text-align:right;}
  .bar-row .hi{color:var(--ink); text-align:left;}
  .bar-track{flex:1; height:3px; background:var(--line-soft); position:relative;}
  .bar-fill{position:absolute; top:0; bottom:0; background:var(--amber-dim); border-radius:2px;}

  .footer-note{text-align:center; font-size:10px; color:var(--ink-faint); letter-spacing:0.06em; margin-top:36px;}
  .status{padding:60px 10px; text-align:center; color:var(--ink-faint); font-size:12px; letter-spacing:0.05em;}
  .status.error{color:var(--red);}

  /* Loading skeleton */
  .skel{background:var(--panel); border:1px solid var(--line); overflow:hidden; position:relative;}
  .skel::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(238,241,243,0.06), transparent);
    animation:shimmer 1.6s infinite;
  }
  @keyframes shimmer{ from{transform:translateX(-100%);} to{transform:translateX(100%);} }
  .skel-hero{height:220px; margin-bottom:28px;}
  .skel-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; margin-bottom:30px;}
  .skel-cell{height:96px; background:var(--panel); border:1px solid var(--line);}
  .skel-row{height:140px; margin-bottom:26px;}

  /* Content fade-in */
  .fade-in{animation:fadeIn 0.45s ease both;}
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  @media (prefers-reduced-motion: reduce){
    .skel::after{animation:none;}
    .fade-in{animation:none;}
    *{scroll-behavior:auto !important;}
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--panel-raised); border:1px solid var(--amber-dim); color:var(--ink);
    padding:10px 18px; font-size:12px; letter-spacing:0.03em; opacity:0; pointer-events:none;
    transition:opacity 0.25s ease;
  }
  .toast.show{opacity:1;}

  @media (max-width:640px){
    .hero{grid-template-columns:1fr; text-align:left;}
    .hero-temp{font-size:72px;}
    .grid{grid-template-columns:repeat(2,1fr);}
    .day{grid-template-columns: 70px 22px 1fr 110px; gap:8px; font-size:11.5px;}
  }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to weather content</a>
<div class="wrap">

  <div class="nameplate">
    <h1>Weather Station</h1>
    <div class="nameplate-right">
      <div class="unit-toggle" id="unitToggle" role="group" aria-label="Temperature unit">
        <button data-unit="c" class="active" aria-pressed="true">&deg;C</button>
        <button data-unit="f" aria-pressed="false">&deg;F</button>
      </div>
      <div class="reg" id="regTime">&mdash; &middot; &mdash;</div>
    </div>
  </div>

  <div style="position:relative;">
    <div class="search-row">
      <label for="cityInput" class="skip-link" style="position:absolute; left:-9999px;">City search</label>
      <input id="cityInput" type="text" placeholder="Enter a city &mdash; e.g. Negombo, Kyoto, Porto" autocomplete="off" aria-label="Search for a city">
      <button class="icon-btn" id="starBtn" title="Save to favourites" aria-label="Save current city to favourites" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3 6.5 7 .9-5.2 4.9 1.3 7-6.1-3.4-6.1 3.4 1.3-7L2 9.4l7-.9z"/></svg>
      </button>
      <button class="icon-btn" id="locBtn" title="Use my location" aria-label="Use my current location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="locate" id="searchBtn" aria-label="Search for entered city">LOCATE</button>
    </div>
    <div class="suggestions" id="suggestions" role="listbox"></div>
  </div>

  <div class="favorites" id="favorites" aria-label="Favourite cities"></div>

  <main id="main" aria-live="polite">
    <div class="skel skel-hero"></div>
    <div class="skel-grid">
      <div class="skel-cell"></div><div class="skel-cell"></div><div class="skel-cell"></div>
      <div class="skel-cell"></div><div class="skel-cell"></div><div class="skel-cell"></div>
    </div>
    <div class="skel skel-row"></div>
  </main>

  <div class="footer-note">Readings via Open&#8209;Meteo &middot; No key, no tracking, updated on request</div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const WCODE = {
  0:['Clear sky','sun'],1:['Mainly clear','sun'],2:['Partly cloudy','cloud-sun'],3:['Overcast','cloud'],
  45:['Fog','fog'],48:['Rime fog','fog'],
  51:['Light drizzle','drizzle'],53:['Drizzle','drizzle'],55:['Dense drizzle','drizzle'],
  56:['Freezing drizzle','drizzle'],57:['Freezing drizzle','drizzle'],
  61:['Light rain','rain'],63:['Rain','rain'],65:['Heavy rain','rain'],
  66:['Freezing rain','rain'],67:['Freezing rain','rain'],
  71:['Light snow','snow'],73:['Snow','snow'],75:['Heavy snow','snow'],77:['Snow grains','snow'],
  80:['Light showers','rain'],81:['Showers','rain'],82:['Violent showers','rain'],
  85:['Snow showers','snow'],86:['Snow showers','snow'],
  95:['Thunderstorm','storm'],96:['Thunderstorm, hail','storm'],99:['Thunderstorm, hail','storm']
};

const AQI_LEVELS = [
  [50,'Good','#5a9aa8'],[100,'Moderate','#c98a4b'],[150,'Unhealthy (sensitive)','#c98a4b'],
  [200,'Unhealthy','#c9705a'],[300,'Very unhealthy','#c9705a'],[99999,'Hazardous','#a15a4d']
];
function aqiLabel(v){
  if(v==null) return ['\u2014','#566270'];
  for(const [max,label,col] of AQI_LEVELS){ if(v<=max) return [label,col]; }
  return ['\u2014','#566270'];
}

function icon(kind, size=22){
  const s = size;
  const common = `width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"`;
  const icons = {
    sun: `<circle cx="12" cy="12" r="4.2"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>`,
    'cloud-sun': `<path d="M8 8a4 4 0 0 1 4-3M9 3v1.5M13.9 4.6l-1 1M4.6 8.1l1 1"/><path d="M6.5 19a3.5 3.5 0 0 1 0-7c.3-2 2.1-3.5 4.2-3.5 2.1 0 3.9 1.6 4.2 3.6A3.2 3.2 0 0 1 17.5 19h-11z"/>`,
    cloud: `<path d="M6.5 19a3.5 3.5 0 0 1-.3-7 4.6 4.6 0 0 1 8.9-1.5A3.6 3.6 0 0 1 19.5 14a3.5 3.5 0 0 1-.5 5h-12.5z"/>`,
    fog: `<path d="M4 9h13M3 13h16M5 17h14M8 5h9"/>`,
    drizzle: `<path d="M6.5 13a3.5 3.5 0 0 1-.3-7 4.6 4.6 0 0 1 8.9-1.5A3.6 3.6 0 0 1 19.5 8 3.5 3.5 0 0 1 19 13h-12.5z"/><path d="M8 17v2M12 17v2M16 17v2"/>`,
    rain: `<path d="M6.5 12a3.5 3.5 0 0 1-.3-7 4.6 4.6 0 0 1 8.9-1.5A3.6 3.6 0 0 1 19.5 7 3.5 3.5 0 0 1 19 12h-12.5z"/><path d="M7 16l-1.5 3M12 16l-1.5 3M17 16l-1.5 3"/>`,
    snow: `<path d="M6.5 12a3.5 3.5 0 0 1-.3-7 4.6 4.6 0 0 1 8.9-1.5A3.6 3.6 0 0 1 19.5 7 3.5 3.5 0 0 1 19 12h-12.5z"/><path d="M8 17v3M8 17l-1.3 1M8 17l1.3 1M8 20l-1.3-1M8 20l1.3-1M16 17v3M16 17l-1.3 1M16 17l1.3 1M16 20l-1.3-1M16 20l1.3-1"/>`,
    storm: `<path d="M6.5 11a3.5 3.5 0 0 1-.3-7 4.6 4.6 0 0 1 8.9-1.5A3.6 3.6 0 0 1 19.5 6 3.5 3.5 0 0 1 19 11h-12.5z"/><path d="M13 13l-3 5h3l-2 4"/>`
  };
  return `<svg ${common}>${icons[kind]||icons.cloud}</svg>`;
}

function alertIconSVG(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 9v5M12 17h.01"/></svg>`;
}
function tipIconSVG(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l6 6L20 6"/></svg>`;
}
function shareIconSVG(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.7l7.6-4.4M8.2 13.3l7.6 4.4"/></svg>`;
}

function compassSVG(deg){
  return `
  <svg width="108" height="108" viewBox="0 0 108 108" role="img" aria-label="Wind direction ${Math.round(deg)} degrees">
    <circle cx="54" cy="54" r="46" fill="none" stroke="#2b3542" stroke-width="1"/>
    <circle cx="54" cy="54" r="36" fill="none" stroke="#202933" stroke-width="1"/>
    ${[0,45,90,135,180,225,270,315].map(a=>{
      const rad=(a-90)*Math.PI/180, x1=54+42*Math.cos(rad), y1=54+42*Math.sin(rad), x2=54+46*Math.cos(rad), y2=54+46*Math.sin(rad);
      return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#3a4552" stroke-width="1"/>`;
    }).join('')}
    <text x="54" y="14" fill="#8b98a5" font-size="9" font-family="IBM Plex Mono" text-anchor="middle">N</text>
    <text x="98" y="57" fill="#566270" font-size="8" font-family="IBM Plex Mono" text-anchor="middle">E</text>
    <text x="54" y="100" fill="#566270" font-size="8" font-family="IBM Plex Mono" text-anchor="middle">S</text>
    <text x="10" y="57" fill="#566270" font-size="8" font-family="IBM Plex Mono" text-anchor="middle">W</text>
    <g transform="rotate(${deg} 54 54)">
      <line x1="54" y1="54" x2="54" y2="20" stroke="#c98a4b" stroke-width="2" stroke-linecap="round"/>
      <line x1="54" y1="54" x2="54" y2="76" stroke="#566270" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="54" cy="54" r="3.5" fill="#c98a4b"/>
    </g>
  </svg>`;
}

function sunArcSVG(sunriseISO, sunsetISO, nowISO){
  const sr = new Date(sunriseISO).getTime(), ss = new Date(sunsetISO).getTime(), now = new Date(nowISO).getTime();
  let frac = (now - sr) / (ss - sr);
  frac = Math.max(0, Math.min(1, frac));
  const w=140,h=52, x = 8 + frac*(w-16), y = h-8 - Math.sin(frac*Math.PI)*(h-22);
  const pastSunset = now > ss || now < sr;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <path d="M8 ${h-8} Q ${w/2} ${14} ${w-8} ${h-8}" fill="none" stroke="#2b3542" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="6" y1="${h-8}" x2="${w-6}" y2="${h-8}" stroke="#3a4552" stroke-width="1"/>
    ${pastSunset ? '' : `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#c98a4b"/>`}
  </svg>`;
}

function fmtTime(iso, tz){
  return new Date(iso).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', hour12:false, timeZone: tz||undefined});
}

function lineChartSVG(days, minOfMin, maxOfMax){
  const w=880, h=150, padL=34, padR=10, padT=16, padB=22;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const range = Math.max(1, maxOfMax-minOfMin);
  const n = days.length;
  const xAt = i => padL + (i/(n-1))*innerW;
  const yAt = v => padT + innerH - ((v-minOfMin)/range)*innerH;
  const hiPts = days.map((d,i)=>`${xAt(i).toFixed(1)},${yAt(d.hi).toFixed(1)}`).join(' ');
  const loPts = days.map((d,i)=>`${xAt(i).toFixed(1)},${yAt(d.lo).toFixed(1)}`).join(' ');
  const areaPts = hiPts + ' ' + days.slice().reverse().map((d,i)=>`${xAt(n-1-i).toFixed(1)},${yAt(days[n-1-i].lo).toFixed(1)}`).join(' ');
  const gridLines = [0,0.5,1].map(f=>{
    const yy = padT + innerH*f;
    const val = Math.round(maxOfMax - f*range);
    return `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${w-padR}" y2="${yy.toFixed(1)}" stroke="#202933" stroke-width="1"/>
      <text x="${padL-6}" y="${(yy+3).toFixed(1)}" fill="#566270" font-size="9" font-family="IBM Plex Mono" text-anchor="end">${val}&deg;</text>`;
  }).join('');
  const labels = days.map((d,i)=>`<text x="${xAt(i).toFixed(1)}" y="${h-4}" fill="#566270" font-size="9" font-family="IBM Plex Mono" text-anchor="middle">${d.label}</text>`).join('');
  const hiDots = days.map((d,i)=>`<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(d.hi).toFixed(1)}" r="2.5" fill="#c98a4b"/>`).join('');
  const loDots = days.map((d,i)=>`<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(d.lo).toFixed(1)}" r="2.5" fill="#5a9aa8"/>`).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible;" role="img" aria-label="7 day high and low temperature trend">
    ${gridLines}
    <polygon points="${areaPts}" fill="#c98a4b" opacity="0.06"/>
    <polyline points="${hiPts}" fill="none" stroke="#c98a4b" stroke-width="1.6"/>
    <polyline points="${loPts}" fill="none" stroke="#5a9aa8" stroke-width="1.6"/>
    ${hiDots}${loDots}${labels}
  </svg>`;
}

const contentEl = document.getElementById('main');
const cityInput = document.getElementById('cityInput');
const suggestBox = document.getElementById('suggestions');
const regTime = document.getElementById('regTime');
const favEl = document.getElementById('favorites');
const starBtn = document.getElementById('starBtn');
const toastEl = document.getElementById('toast');

let state = { unit:'c', favorites:[], current:null, label:'', lat:null, lon:null, tz:null };

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2200);
}

function setClock(tz){
  function tick(){
    const now = new Date();
    const opts = {hour:'2-digit', minute:'2-digit', hour12:false};
    if(tz) opts.timeZone = tz;
    const timeStr = now.toLocaleTimeString('en-GB', opts);
    const dateStr = now.toLocaleDateString('en-GB', {weekday:'short', day:'2-digit', month:'short', timeZone: tz||undefined});
    regTime.textContent = `${dateStr} \u00b7 ${timeStr}`;
  }
  tick();
  clearInterval(window.__clockTimer);
  window.__clockTimer = setInterval(tick, 30000);
}
setClock();

document.getElementById('unitToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  state.unit = btn.dataset.unit;
  document.querySelectorAll('#unitToggle button').forEach(b=>{
    const active = b===btn;
    b.classList.toggle('active', active);
    b.setAttribute('aria-pressed', active ? 'true' : 'false');
  });
  if(state.current) render(state.current, state.label, state.tz);
});

function c2f(c){ return c*9/5+32; }
function dtemp(v){ return state.unit==='f' ? Math.round(c2f(v)) : Math.round(v); }
function unitSuffix(){ return state.unit==='f' ? '\u00b0F' : '\u00b0C'; }

function renderFavorites(){
  favEl.innerHTML = state.favorites.map(f=>`
    <div class="fav-chip" data-lat="${f.lat}" data-lon="${f.lon}" data-label="${f.label}" data-tz="${f.tz}">
      <span tabindex="0" role="button">${f.label.split(',')[0]}</span> <span class="x" data-remove="${f.label}" role="button" tabindex="0" aria-label="Remove ${f.label} from favourites">&times;</span>
    </div>`).join('');
  favEl.querySelectorAll('.fav-chip').forEach(chip=>{
    chip.addEventListener('click', (e)=>{
      if(e.target.dataset.remove){
        state.favorites = state.favorites.filter(f=>f.label!==e.target.dataset.remove);
        renderFavorites();
        return;
      }
      cityInput.value = chip.dataset.label;
      loadWeather(chip.dataset.lat, chip.dataset.lon, chip.dataset.label, chip.dataset.tz);
    });
  });
  updateStarState();
}

function updateStarState(){
  const isFav = state.favorites.some(f=>f.label===state.label);
  starBtn.classList.toggle('starred', isFav);
  starBtn.setAttribute('aria-pressed', isFav ? 'true' : 'false');
}

starBtn.addEventListener('click', ()=>{
  if(!state.label) return;
  const exists = state.favorites.some(f=>f.label===state.label);
  if(exists){
    state.favorites = state.favorites.filter(f=>f.label!==state.label);
  } else {
    state.favorites.push({label:state.label, lat:state.lat, lon:state.lon, tz:state.tz});
  }
  renderFavorites();
});

document.getElementById('locBtn').addEventListener('click', ()=>{
  if(!navigator.geolocation){
    contentEl.innerHTML = `<div class="status error">Geolocation isn't available in this browser.</div>`;
    return;
  }
  showSkeleton();
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const {latitude, longitude} = pos.coords;
    let label = `${latitude.toFixed(2)}, ${longitude.toFixed(2)}`;
    let tz = undefined;
    try{
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${latitude}&longitude=${longitude}&language=en&format=json`);
      const d = await r.json();
      if(d.results && d.results[0]){
        const g = d.results[0];
        label = [g.name, g.admin1, g.country].filter(Boolean).join(', ');
        tz = g.timezone;
      }
    }catch(e){}
    cityInput.value = label;
    loadWeather(latitude, longitude, label, tz);
  }, ()=>{
    contentEl.innerHTML = `<div class="status error">Couldn't get your location &mdash; check browser permissions.</div>`;
  });
});

let debounceTimer;
cityInput.addEventListener('input', ()=>{
  clearTimeout(debounceTimer);
  const q = cityInput.value.trim();
  if(q.length < 2){ suggestBox.style.display='none'; return; }
  debounceTimer = setTimeout(()=>fetchSuggestions(q), 300);
});

async function fetchSuggestions(q){
  try{
    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=en&format=json`);
    const data = await res.json();
    if(!data.results || !data.results.length){ suggestBox.style.display='none'; return; }
    suggestBox.innerHTML = data.results.map(r=>{
      const parts = [r.name, r.admin1, r.country].filter(Boolean);
      return `<div role="option" data-lat="${r.latitude}" data-lon="${r.longitude}" data-label="${parts.join(', ')}" data-tz="${r.timezone}">${parts.join(', ')}</div>`;
    }).join('');
    suggestBox.style.display='block';
    suggestBox.querySelectorAll('div').forEach(div=>{
      div.addEventListener('click', ()=>{
        cityInput.value = div.dataset.label;
        suggestBox.style.display='none';
        loadWeather(div.dataset.lat, div.dataset.lon, div.dataset.label, div.dataset.tz);
      });
    });
  }catch(e){ suggestBox.style.display='none'; }
}

document.getElementById('searchBtn').addEventListener('click', async ()=>{
  const q = cityInput.value.trim();
  if(!q) return;
  suggestBox.style.display='none';
  showSkeleton();
  try{
    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`);
    const data = await res.json();
    if(!data.results || !data.results.length){
      contentEl.innerHTML = `<div class="status error">No location found for "${q}". Try a different spelling.</div>`;
      return;
    }
    const r = data.results[0];
    const label = [r.name, r.admin1, r.country].filter(Boolean).join(', ');
    cityInput.value = label;
    loadWeather(r.latitude, r.longitude, label, r.timezone);
  }catch(e){
    contentEl.innerHTML = `<div class="status error">Could not reach the weather service. Check your connection and try again.</div>`;
  }
});
cityInput.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('searchBtn').click(); });

function showSkeleton(){
  contentEl.innerHTML = `
    <div class="skel skel-hero"></div>
    <div class="skel-grid">
      <div class="skel-cell"></div><div class="skel-cell"></div><div class="skel-cell"></div>
      <div class="skel-cell"></div><div class="skel-cell"></div><div class="skel-cell"></div>
    </div>
    <div class="skel skel-row"></div>`;
}

async function loadWeather(lat, lon, label, tz){
  showSkeleton();
  try{
    const wUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max,precipitation_probability_max,sunrise,sunset&timezone=${encodeURIComponent(tz||'auto')}&forecast_days=7`;
    const aUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi&timezone=${encodeURIComponent(tz||'auto')}`;
    const [wRes, aRes] = await Promise.all([fetch(wUrl), fetch(aUrl).catch(()=>null)]);
    const d = await wRes.json();
    if(!d.current){ throw new Error('bad data'); }
    let aqi = null;
    if(aRes && aRes.ok){
      try{ const ad = await aRes.json(); aqi = ad.current ? ad.current.us_aqi : null; }catch(e){}
    }
    d.__aqi = aqi;
    state.current = d; state.label = label; state.lat = lat; state.lon = lon; state.tz = tz || d.timezone;
    render(d, label, state.tz);
    setClock(state.tz);
    updateStarState();
  }catch(e){
    contentEl.innerHTML = `<div class="status error">Could not read weather data for ${label}. Please try again.</div>`;
  }
}

function buildAlerts(c, today, condLabel){
  const alerts = [];
  const code = c.weather_code;
  if([95,96,99].includes(code)) alerts.push('Thunderstorms in the area — avoid open ground and water.');
  if(c.wind_speed_10m >= 40) alerts.push(`Strong winds (${Math.round(c.wind_speed_10m)} km/h) — secure loose outdoor items.`);
  if(today.uv_index_max[0] >= 8) alerts.push(`Very high UV index (${today.uv_index_max[0].toFixed(1)}) — limit midday sun exposure.`);
  if(today.temperature_2m_max[0] >= 36) alerts.push('Extreme heat expected — stay hydrated and avoid strenuous activity outdoors.');
  if(today.temperature_2m_min[0] <= 2) alerts.push('Near-freezing temperatures overnight — protect sensitive plants and pipes.');
  if(today.precipitation_probability_max[0] >= 80 && [61,63,65,80,81,82].includes(code)) alerts.push('High chance of heavy rain — allow extra travel time.');
  return alerts;
}

function buildAdvisory(c, today){
  const tips = [];
  const code = c.weather_code;
  const tMax = today.temperature_2m_max[0];
  const rainChance = today.precipitation_probability_max[0];
  const uv = today.uv_index_max[0];

  if(rainChance >= 40 || [51,53,55,61,63,65,80,81,82].includes(code)) tips.push('Carry an umbrella or light raincoat.');
  if(uv >= 6) tips.push('Sunscreen recommended if you\u2019ll be outside midday.');
  if(tMax <= 15) tips.push('Layer up — a jacket will help.');
  else if(tMax >= 30) tips.push('Light, breathable clothing and water are a good idea.');
  if(c.wind_speed_10m >= 25) tips.push('Breezy out — a windbreaker helps.');
  if([71,73,75,77,85,86].includes(code)) tips.push('Snow underfoot — wear grippy footwear.');
  if(tips.length === 0) tips.push('Conditions look comfortable — no special preparation needed.');
  return tips;
}

function render(d, label, tz){
  const c = d.current;
  const [condLabel, condIcon] = WCODE[c.weather_code] || ['Unknown', 'cloud'];
  const today = d.daily;
  const hiT = dtemp(today.temperature_2m_max[0]);
  const loT = dtemp(today.temperature_2m_min[0]);
  const [aqiText, aqiCol] = aqiLabel(d.__aqi);

  let startIdx = d.hourly.time.findIndex(t => t >= c.time);
  if(startIdx < 0) startIdx = 0;
  const hourly = [];
  for(let i=startIdx; i<startIdx+12 && i<d.hourly.time.length; i++){
    const dt = new Date(d.hourly.time[i]);
    const [,ic] = WCODE[d.hourly.weather_code[i]] || [,'cloud'];
    hourly.push({
      label: i===startIdx ? 'Now' : dt.toLocaleTimeString('en-GB',{hour:'2-digit', minute:'2-digit', hour12:false}),
      temp: dtemp(d.hourly.temperature_2m[i]),
      icon: ic,
      precip: d.hourly.precipitation_probability[i]
    });
  }

  const maxOfMax = Math.max(...today.temperature_2m_max.map(dtemp));
  const minOfMin = Math.min(...today.temperature_2m_min.map(dtemp));
  const range = Math.max(1, maxOfMax - minOfMin);

  const chartDays = today.time.map((t,i)=>{
    const dt = new Date(t+'T00:00:00');
    return { label: i===0?'Today':dt.toLocaleDateString('en-GB',{weekday:'short'}), hi: dtemp(today.temperature_2m_max[i]), lo: dtemp(today.temperature_2m_min[i]) };
  });

  const dayRows = today.time.map((t,i)=>{
    const dt = new Date(t+'T00:00:00');
    const dname = i===0 ? 'Today' : dt.toLocaleDateString('en-GB',{weekday:'short'});
    const [cl, ci] = WCODE[today.weather_code[i]] || ['\u2014','cloud'];
    const dh = dtemp(today.temperature_2m_max[i]);
    const dl = dtemp(today.temperature_2m_min[i]);
    const leftPct = ((dl - minOfMin)/range*100);
    const widthPct = Math.max(6, ((dh-dl)/range*100));
    return `<div class="day">
      <div class="d">${dname}</div>
      <div>${icon(ci,18)}</div>
      <div class="cond">${cl}</div>
      <div class="bar-row">
        <span class="lo">${dl}\u00b0</span>
        <div class="bar-track"><div class="bar-fill" style="left:${leftPct}%; width:${widthPct}%;"></div></div>
        <span class="hi">${dh}\u00b0</span>
      </div>
    </div>`;
  }).join('');

  const alerts = buildAlerts(c, today, condLabel);
  const alertHtml = alerts.length ? `
    <div class="alert-banner" role="alert">
      ${alertIconSVG()}
      <div class="lines">${alerts.map(a=>`<div>${a}</div>`).join('')}</div>
    </div>` : '';

  const advisory = buildAdvisory(c, today);
  const advisoryHtml = `
    <div class="advisory">
      <div class="k">TODAY'S ADVISORY</div>
      <ul>${advisory.map(t=>`<li>${tipIconSVG()}<span>${t}</span></li>`).join('')}</ul>
    </div>`;

  contentEl.innerHTML = `
    <div class="fade-in">
    ${alertHtml}
    <div class="hero">
      <div>
        <div class="hero-top-row">
          <div class="hero-loc">CURRENT CONDITIONS \u00b7 <span>${label}</span></div>
        </div>
        <div class="hero-temp">${dtemp(c.temperature_2m)}<sup>${unitSuffix()}</sup></div>
        <div class="hero-cond">${condLabel}, feels like ${dtemp(c.apparent_temperature)}\u00b0</div>
        <div class="hero-range">HIGH ${hiT}\u00b0 \u00b7 LOW ${loT}\u00b0</div>
        <div class="hero-time">LAT ${parseFloat(d.latitude).toFixed(2)} \u00b7 LON ${parseFloat(d.longitude).toFixed(2)} \u00b7 ${tz||'local time'}</div>
        <button class="share-btn" id="shareBtn" style="margin-top:14px;">${shareIconSVG()} SHARE</button>
      </div>
      <div class="dial-wrap">
        ${compassSVG(c.wind_direction_10m)}
        <div class="dial-label">WIND ${Math.round(c.wind_speed_10m)} KM/H</div>
      </div>
    </div>

    ${advisoryHtml}

    <div class="grid">
      <div class="cell">
        <div class="k">HUMIDITY</div>
        <div class="v">${c.relative_humidity_2m}<span class="unit">%</span></div>
      </div>
      <div class="cell">
        <div class="k">PRESSURE</div>
        <div class="v">${Math.round(c.surface_pressure)}<span class="unit">hPa</span></div>
      </div>
      <div class="cell">
        <div class="k">UV INDEX (MAX)</div>
        <div class="v">${today.uv_index_max[0].toFixed(1)}</div>
        <div class="sub">${today.uv_index_max[0] > 7 ? 'Very high \u2014 cover up' : today.uv_index_max[0] > 4 ? 'Moderate' : 'Low'}</div>
      </div>
      <div class="cell">
        <div class="k">SUNRISE / SUNSET</div>
        <div class="sun-row">${sunArcSVG(today.sunrise[0], today.sunset[0], c.time)}</div>
        <div class="sub">${fmtTime(today.sunrise[0], tz)} &nbsp;&middot;&nbsp; ${fmtTime(today.sunset[0], tz)}</div>
      </div>
      <div class="cell">
        <div class="k">AIR QUALITY (US AQI)</div>
        <div class="v">${d.__aqi != null ? d.__aqi : '\u2014'}</div>
        <div class="sub" style="color:${aqiCol}">${aqiText}</div>
      </div>
      <div class="cell">
        <div class="k">RAIN CHANCE TODAY</div>
        <div class="v">${today.precipitation_probability_max[0]}<span class="unit">%</span></div>
      </div>
    </div>

    <div class="section-head"><div class="t">NEXT 12 HOURS</div><div class="rule"></div></div>
    <div class="hourly">
      ${hourly.map(h=>`<div class="hour">
        <div class="t">${h.label}</div>
        ${icon(h.icon,22)}
        <div class="temp">${h.temp}\u00b0</div>
        <div class="precip">${h.precip}%</div>
      </div>`).join('')}
    </div>

    <div class="section-head"><div class="t">7-DAY TREND</div><div class="rule"></div></div>
    <div class="chart-panel">${lineChartSVG(chartDays, minOfMin, maxOfMax)}</div>

    <div class="section-head"><div class="t">7-DAY OUTLOOK</div><div class="rule"></div></div>
    <div class="daily">${dayRows}</div>
    </div>
  `;

  const shareBtn = document.getElementById('shareBtn');
  if(shareBtn){
    shareBtn.addEventListener('click', async ()=>{
      const text = `${label}: ${dtemp(c.temperature_2m)}${unitSuffix()}, ${condLabel.toLowerCase()}. Checked on Weather Station.`;
      if(navigator.share){
        try{ await navigator.share({ title:'Weather Station', text }); }catch(e){}
      } else if(navigator.clipboard){
        try{ await navigator.clipboard.writeText(text); showToast('Copied to clipboard'); }catch(e){ showToast('Could not copy'); }
      } else {
        showToast(text);
      }
    });
  }
}

if('serviceWorker' in navigator && window.isSecureContext){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
